<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 | SHIFT NYC</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    @font-face {
      font-family: 'Archivo Variable';
      font-style: normal;
      font-display: swap;
      font-weight: 100 900;
      src: url('/assets/archivo-latin-wght-normal-E0tuGl4L.woff2') format('woff2-variations');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-display: swap;
      font-weight: 400;
      src: url('/assets/jetbrains-mono-latin-400-normal-V6pRDFza.woff2') format('woff2');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    :root {
      --negro: #050505;
      --blanco: #ededed;
      --gris: #8a8a8a;
      --rojo: #ff1a1a;
      --linea: #262626;
      --font-display: 'Archivo Variable', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--negro);
      color: var(--blanco);
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .site-header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(5, 5, 5, 0.95);
      border-bottom: 1px solid var(--linea);
      z-index: 20;
    }
    .brand-group {
      display: flex;
      align-items: center;
    }
    .brand-link {
      display: inline-flex;
      align-items: center;
      color: var(--blanco);
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    .brand-link:hover {
      opacity: 0.8;
    }
    .header-logo {
      height: 22px;
      width: 88px;
      display: block;
    }
    .error-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 64px 24px;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }
    .error-tag {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--gris);
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    .error-title {
      font-family: var(--font-display);
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--blanco);
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .error-desc {
      font-size: 14px;
      line-height: 1.6;
      color: var(--gris);
      margin-bottom: 36px;
      max-width: 480px;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
    }
    .btn-action-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      background: var(--blanco);
      color: var(--negro);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-decoration: none;
      border: 1px solid var(--blanco);
      border-radius: 2px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .btn-action-primary:hover {
      background: #d4d4d4;
    }
    .btn-action-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      background: transparent;
      color: var(--blanco);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-decoration: none;
      border: 1px solid var(--linea);
      border-radius: 2px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .btn-action-secondary:hover {
      border-color: var(--blanco);
      background: rgba(255, 255, 255, 0.04);
    }
    @media (max-width: 480px) {
      .error-container {
        padding: 48px 20px;
      }
      .error-actions {
        flex-direction: column;
      }
      .btn-action-primary, .btn-action-secondary {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand-group">
      <a href="/" class="brand-link" aria-label="SHIFT NYC"><img src="/logo/shift.svg" alt="SHIFT NYC" class="header-logo" width="88" height="22"></a>
    </div>
  </header>
  <main class="error-container">
    <p class="error-tag">ERROR 404</p>
    <h1 class="error-title">WRONG DOOR.</h1>
    <p class="error-desc">This page doesn't exist. The night goes on somewhere else.</p>
    <div class="error-actions">
      <a href="/" class="btn-action-primary">BACK TO SHIFT</a>
      <a href="https://ra.co/promoters/101532" target="_blank" rel="noopener" class="btn-action-secondary">FOLLOW SHIFT ON RA ↗</a>
    </div>
  </main>
</body>
</html>
